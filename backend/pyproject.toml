[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "python-jose>=3.5.0",
    "structlog>=25.5.0",
    "supabase>=2.28.3",
    "uvicorn>=0.43.0",
]


[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "mypy>=1.20.0",
    "types-python-jose>=3.5.0.20260402",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode =  "standard"