<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>easy shopping — prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/hub.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/devpanel.css" />
  </head>
  <body class="dark">
    <div class="shell dark" id="shell">
      <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="topbar-left">
          <nav class="breadcrumb" id="breadcrumb" aria-label="breadcrumb"></nav>
        </div>
        <div class="topbar-right">
          <div class="avatar" id="topbar-avatar" onclick="navigateTo('profile')">LE</div>
        </div>
      </header>

      <!-- ── Content ─────────────────────────────────────────────────────────── -->
      <main class="content" id="content">
        <div class="view active" id="view-home">
          <div class="hub-inner">
            <p class="hub-greeting" id="hub-greeting"></p>
            <p class="hub-sub">No active shopping trips.</p>

            <div class="hub-sections">
              <div class="hub-card" onclick="navigateTo('lists')">
                <div class="hub-card-icon">☰</div>
                <div class="hub-card-title">Lists</div>
                <div class="hub-card-meta">3 lists</div>
              </div>
              <div class="hub-card" onclick="navigateTo('groups')">
                <div class="hub-card-icon">⊞</div>
                <div class="hub-card-title">Groups</div>
                <div class="hub-card-meta">3 groups</div>
              </div>
              <div class="hub-card" onclick="navigateTo('profile')">
                <div class="hub-card-icon">
                  <div class="avatar hub-avatar" id="hub-avatar">LE</div>
                </div>
                <div class="hub-card-title">Profile</div>
                <div class="hub-card-meta" id="hub-username">@lena</div>
              </div>
            </div>

            <div id="pending-invites-strip"></div>

            <div class="recent-strip">
              <div class="recent-header">
                <p class="section-label" style="margin-bottom: 0">Recent</p>
                <button class="add-btn" onclick="navigateTo('lists')">
                  + New list
                </button>
              </div>
              <div class="recent-list" id="recent-list"></div>
            </div>
          </div>
        </div>
      </main>

      <!-- ── Bottom nav (mobile) ──────────────────────────────────────────────── -->
      <nav class="bottom-nav">
        <div class="bottom-nav-inner">
          <button
            class="bnav-item active"
            id="bnav-home"
            onclick="navigateTo('home')">
            <span class="bnav-icon">⌂</span>
            <span class="bnav-label">Home</span>
          </button>
          <button
            class="bnav-item"
            id="bnav-lists"
            onclick="navigateTo('lists')">
            <span class="bnav-icon">☰</span>
            <span class="bnav-label">Lists</span>
          </button>
          <button
            class="bnav-item"
            id="bnav-groups"
            onclick="navigateTo('groups')">
            <span class="bnav-icon">⊞</span>
            <span class="bnav-label">Groups</span>
          </button>
          <button
            class="bnav-item"
            id="bnav-profile"
            onclick="navigateTo('profile')">
            <span class="bnav-icon">◯</span>
            <span class="bnav-label">Profile</span>
          </button>
        </div>
      </nav>
    </div>

    <!-- Scripts load in dependency order -->
    <script src="data.js"></script>
    <script src="helpers.js"></script>
    <script src="views.js"></script>
    <script src="nav.js"></script>
    <script src="modal.js"></script>
    <script src="devpanel.js"></script>
    <script src="app.js"></script>
  </body>
</html>
